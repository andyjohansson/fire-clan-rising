<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Fire Clan Rising</title>
	</head>
	<body>
		<div id="game"></div>
		<div id="loading">
			<div id="loading-scene"></div>
			<div id="loading-overlay">
				<div id="loading-title">
					<h1>Fire Clan Rising</h1>
					<p>The Last Egg</p>
				</div>
				<p id="loading-story"></p>
				<div id="loading-bottom">
					<p id="loading-status">Waking the egg… 0%</p>
					<button id="loading-start" type="button">Press to start</button>
				</div>
			</div>
		</div>
		<div id="selection-box"></div>
		<div id="hud">
			<h1>Fire Clan Rising</h1>
			<p>Left click / drag: select ninjas &middot; Right click: move</p>
			<p>WASD / arrows / screen edge: move camera &middot; Wheel: zoom</p>
		</div>
		<div id="fps-meter">
			<div><span class="fps-label">FPS</span> <span id="fps-value">–</span> <span id="fps-rating"></span></div>
			<div><span class="fps-label">Frame</span> <span id="fps-frame">–</span></div>
			<div><span class="fps-label">Draws</span> <span id="fps-calls">–</span></div>
			<div><span class="fps-label">Tris</span> <span id="fps-triangles">–</span></div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
